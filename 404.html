<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found — MOYA</title>
  <link rel="icon" type="image/png" href="https://assets.cdn.filesafe.space/jsuZqhDRfnfSBFMgdfs2/media/6a5222f50e67afc013938126.png">
  <link rel="shortcut icon" type="image/png" href="https://assets.cdn.filesafe.space/jsuZqhDRfnfSBFMgdfs2/media/6a5222f50e67afc013938126.png">
</head>
<body>
<style>
    /* Scope all styles to a specific wrapper to avoid conflicting with the GoHighLevel builder */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    #moya-404-wrapper {
        --brand-red: #FF0000;
        --brand-dark: #080808;
        --text-light: #e2dcf0;
        
        position: relative;
        background-color: var(--brand-dark);
        color: var(--text-light);
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        overflow: hidden;
        text-align: center;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    #moya-404-wrapper * {
        box-sizing: border-box;
    }

    #moya-404-wrapper .error-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #moya-404-wrapper .error-code {
        font-size: clamp(8rem, 20vw, 15rem);
        font-weight: 900;
        margin: 0;
        line-height: 1;
        letter-spacing: -5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        text-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
        user-select: none;
        padding: 30px;
        margin-top: -30px;
        margin-bottom: -30px;
        cursor: default;
    }

    #moya-404-wrapper .broken-zero {
        display: inline-block;
        color: var(--brand-red);
        position: relative;
        transform-origin: top right;
        margin: 0 10px;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    #moya-404-wrapper .broken-zero::before, 
    #moya-404-wrapper .broken-zero::after {
        content: '0';
        position: absolute;
        top: 0;
        left: 0;
        opacity: 0.8;
        color: var(--brand-red);
    }

    #moya-404-wrapper .broken-zero::before {
        animation: moya-glitch-anim-1 2.5s infinite linear alternate-reverse;
        clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%);
        left: -2px;
        text-shadow: -2px 0 rgba(255, 255, 255, 0.5);
    }

    #moya-404-wrapper .broken-zero::after {
        animation: moya-glitch-anim-2 3s infinite linear alternate-reverse;
        clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%);
        left: 2px;
        text-shadow: 2px 0 rgba(255, 255, 255, 0.5);
    }

    #moya-404-wrapper .error-code:hover .broken-zero {
        transform: rotate(25deg) translateY(25px);
    }

    @keyframes moya-glitch-anim-1 {
        0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px, 2px); }
        20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px, -2px); }
        40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px, 2px); }
        60% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); transform: translate(2px, -2px); }
        80% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(-2px, 2px); }
        100% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); transform: translate(2px, -2px); }
    }

    @keyframes moya-glitch-anim-2 {
        0% { clip-path: polygon(0 25%, 100% 25%, 100% 30%, 0 30%); transform: translate(2px, -2px); }
        20% { clip-path: polygon(0 3%, 100% 3%, 100% 3%, 0 3%); transform: translate(-2px, 2px); }
        40% { clip-path: polygon(0 40%, 100% 40%, 100% 45%, 0 45%); transform: translate(2px, -2px); }
        60% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); transform: translate(-2px, 2px); }
        80% { clip-path: polygon(0 90%, 100% 90%, 100% 95%, 0 95%); transform: translate(2px, -2px); }
        100% { clip-path: polygon(0 15%, 100% 15%, 100% 20%, 0 20%); transform: translate(-2px, 2px); }
    }

    #moya-404-wrapper .error-message {
        font-size: 2.5rem;
        font-weight: 800;
        margin-top: 1rem;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    #moya-404-wrapper .error-sub {
        font-size: 1.1rem;
        color: #a097b5;
        margin-top: 0.5rem;
        margin-bottom: 3rem;
        max-width: 450px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.6;
    }

    /* Background effects */
    #moya-404-wrapper .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, rgba(255, 0, 0, 0.15) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
    }
    
    #moya-404-wrapper .grid-bg {
        position: absolute;
        inset: 0;
        background-size: 50px 50px;
        background-image: 
            linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
        z-index: 0;
        transform: perspective(500px) rotateX(60deg) translateY(-100px) scale(2);
        opacity: 0.3;
    }

    @media (max-width: 768px) {
        #moya-404-wrapper .error-message { font-size: 1.8rem; }
        #moya-404-wrapper .error-sub { font-size: 1rem; padding: 0 1.5rem; }
    }
</style>

<div id="moya-404-wrapper">
    <div class="grid-bg"></div>
    <div class="bg-gradient"></div>
    
    <div class="error-container">
        <h1 class="error-code">
            <span>4</span>
            <span class="broken-zero">0</span>
            <span>4</span>
        </h1>
        <div class="error-message">ERROR 404</div>
        <p class="error-sub">It looks like we landed on the wrong page.</p>
    </div>
</div>

</body>
</html>
