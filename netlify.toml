  command = "npm run build"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
