<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MOYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #111;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        .contact-method {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }
        .contact-method:hover {
            transform: translateY(-2px);
            border-color: #e0e0e0;
        }
        .contact-icon {
            font-size: 1.8rem;
            margin-right: 15px;
            min-width: 40px;
            text-align: center;
        }
        .contact-details h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #222;
        }
        .contact-details p {
            margin: 0;
            color: #555;
            font-size: 0.95rem;
        }
        .contact-details a {
            color: #007bff;
            text-decoration: none;
        }
        .contact-details a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }
            body {
                padding: 20px 10px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
  <link rel="icon" type="image/png" href="https://assets.cdn.filesafe.space/jsuZqhDRfnfSBFMgdfs2/media/6a5222f50e67afc013938126.png">
  <link rel="shortcut icon" type="image/png" href="https://assets.cdn.filesafe.space/jsuZqhDRfnfSBFMgdfs2/media/6a5222f50e67afc013938126.png">
</head>
<body>
    <div class="container">
        <h1>Contact Us – Mechanism of YouTube Automation (MOYA)</h1>
        
        <div class="contact-method">
            <div class="contact-icon">📧</div>
            <div class="contact-details">
                <h3>Email Support</h3>
                <p><a href="mailto:cashytautomation@gmail.com">cashytautomation@gmail.com</a></p>
            </div>
        </div>

        <div class="contact-method">
            <div class="contact-icon">💬</div>
            <div class="contact-details">
                <h3>WhatsApp Support</h3>
                <p><a href="https://wa.me/919274359207" target="_blank">+91 92743 59207</a></p>
            </div>
        </div>

        <div class="contact-method">
            <div class="contact-icon">🕒</div>
            <div class="contact-details">
                <h3>Working Hours</h3>
                <p>Monday – Saturday, 10:00 AM – 6:00 PM IST</p>
            </div>
        </div>

        <div class="contact-method">
            <div class="contact-icon">📍</div>
            <div class="contact-details">
                <h3>Operational Address</h3>
                <p>Ahmedabad, Gujarat, India</p>
            </div>
        </div>
    </div>
</body>
</html>
